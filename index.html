<!DOCTYPE html>

<head>

    <style>

        body { background-color: #f7f9fc; margin: 0; padding: 15px; color: #333; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-top: 10px; min-height: 80vh; display: flex; flex-direction: column; justify-content: space-between; }

        p { text-align: center; color: #7b8a99; font-size: 15px; margin-bottom: 20px; line-height: 1.4; }
        .grid-menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-height: 75vh; overflow-y: auto; padding-right: 4px; }
        .btn-bloco { width: 100%; padding: 16px; border: 2px solid #e2e8f0; background: #fff; border-radius: 12px; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
        .btn-bloco:active { transform: scale(0.98); }
        .btn-bloco.concluido { border-color: #2cd46b; background-color: #f0fdf4; color: #166534; }
        .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #f1f5f9; color: #64748b; font-weight: bold; }
        .concluido .status-badge { background: #2cd46b; color: white; }
        .progress-bar-container { width: 100%; background: #e2e8f0; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s ease; }
        .lista-reconhecimento { display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; padding-right: 4px; }
        .item-reconhecer { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 500; }
        .item-reconhecer:active { background: #cbd5e1; }
        .speaker-icon { color: #3b82f6; font-size: 18px; }
        .palavra-pergunta { font-size: 26px; font-weight: 800; text-align: center; margin: 30px 0; color: #1e3a8a; }
        .opcoes-container { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .btn-opcao { width: 100%; padding: 16px; border: 2px solid #e2e8f0; background: white; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.15s ease; }
        .colunas-combinar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; width: 100%; }
        .coluna { display: flex; flex-direction: column; gap: 8px; }
        .btn-combinar { padding: 14px 8px; border: 2px solid #e2e8f0; background: white; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; min-height: 54px; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }

        .btn-combinar.correto { border-color: #2cd46b; background-color: #f0fdf4; color: #166534; pointer-events: none; opacity: 0.6; }
        .btn-acao-principal { width: 100%; padding: 16px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; margin-top: 24px; cursor: pointer; }
        .btn-acao-principal:hover { background: #2563eb; }
        .oculto { display: none !important; }

</head>

            // Bloco 20: Estados de Espírito e Ofensas
            [{pt:"Chateado",es:"Enojado",alt:["Alegre","Cansado","Listo"]},{pt:"Chato",es:"Aburrito",alt:["Divertido","Inteligente","Rápido"]},{pt:"Zangado",es:"Enfadado",alt:["Contento","Sorprendido","Calmado"]},{pt:"Preguiçoso",es:"Perezoso",alt:["Trabajador","Activo","Listo"]},{pt:"Espantado",es:"Asombrado",alt:["Aburrito","Cansado","Enojado"]},{pt:"Inveja",es:"Envidia",alt:["Alegría","Tristeza","Amor"]},{pt:"Mau hálito",es:"Mal aliento",alt:["Buen olor","Aroma","Sabor"]},{pt:"Fedor",es:"Hedor",alt:["Aroma","Perfume","Limpieza"]},{pt:"Cansado",es:"Cansado",alt:["Activo","Fuerte","Sano"]},{pt:"Derrotado",es:"Derrotado",alt:["Ganador","Fuerte","Feliz"]}],
            // Bloco 21: Diálogos Práticos
            [{pt:"Um momento",es:"Un rato",alt:["Una hora","Un día","Siempre"]},{pt:"Frequentemente",es:"A menudo",alt:["Nunca","Raras veces","Mañana"]},{pt:"No entanto",es:"Sin embargo",alt:["Porque","Entonces","Además"]},{pt:"Eu gosto",es:"Me gusta",alt:["Odio","Prefiero","Quiero"]},{pt:"Isso mesmo",es:"Así es",alt:["No sé","Quizás","Nunca"]},{pt:"Me contou",es:"Me contó",alt:["Me miró","Me escuchó","Me llamó"]},{pt:"Embora",es:"Aunque",alt:["Porque","Cuando","Si"]},{pt:"Não acha?",es:"¿No crees?",alt:["¿Qué tal?","¿Cómo estás?","¿Adiós?"]},{pt:"Sinto muito",es:"Lo siento",alt:["Gracias","De nada","Hola"]},{pt:"Tudo bem!",es:"Vale",alt:["Adiós","No","Nunca"]}],
            // Bloco 22: Advérbios e Períodos de Tempo
            [{pt:"Ontem",es:"Ayer",alt:["Hoy","Mañana","Ahora"]},{pt:"Hoje",es:"Hoy",alt:["Ayer","Mañana","Ahora"]},{pt:"Amanhã",es:"Mañana",alt:["Ayer","Hoy","Anoche"]},{pt:"Agora",es:"Ahora",alt:["Después","Antes","Nunca"]},{pt:"Lá",es:"Allá",alt:["Aquí","Cerca","Lejos"]},{pt:"Enquanto",es:"Mientras",alt:["Después","Entonces","Cuando"]},{pt:"Entre",es:"Entre",alt:["Fuera","Sobre","Bajo"]},{pt:"Frequentemente",es:"Frecuentemente",alt:["Nunca","Jamás","Hoy"]},{pt:"Muito bom",es:"Muy bueno",alt:["Malo","Regular","Feo"]},{pt:"Os preços",es:"Los precios",alt:["Las cuentas","Las monedas","Las tarjetas"]}],
            // Bloco 23: Trabalho, Comércio e Profissões
            [{pt:"Trabalho",es:"Trabajo",alt:["Descanso","Juego","Fiesta"]},{pt:"Dirige",es:"Maneja",alt:["Camina","Corre","Vuela"]},{pt:"Idoso",es:"Mayores",alt:["Niño","Joven","Chico"]},{pt:"Aposentado",es:"Jubilado",alt:["Empleado","Estudiante","Piloto"]},{pt:"Desempregado",es:"Desempleado",alt:["Trabajador","Gerente","Chofer"]},{pt:"Vocês",es:"Ustedes",alt:["Nosotros","Ellos","Vosotros"]},{pt:"Nota fiscal",es:"Factura",alt:["Tarjeta","Dinero","Billete"]},{pt:"Vitrine",es:"Escaparate",alt:["Mostrador","Mesa","Silla"]},{pt:"Balcão",es:"Mostrador",alt:["Oficina","Puerta","Ascensor"]},{pt:"Povoado",es:"Pueblo",alt:["Ciudad","Capital","País"]}],
            // Bloco 24: Estações do Ano e Clima
            [{pt:"Primavera",es:"Primavera",alt:["Verano","Otoño","Invierno"]},{pt:"Verão",es:"Verano",alt:["Primavera","Otoño","Invierno"]},{pt:"Outono",es:"Otoño",alt:["Primavera","Verano","Invierno"]},{pt:"Inverno",es:"Invierno",alt:["Primavera","Verano","Otoño"]},{pt:"Roxo",es:"Morado",alt:["Rojo","Azul","Verde"]},{pt:"Cinza",es:"Gris",alt:["Blanco","Negro","Rojo"]},{pt:"Amarelo",es:"Amarillo",alt:["Verde","Azul","Rojo"]},{pt:"Manchado",es:"Manchado",alt:["Pintado","Limpio","Nuevo"]},{pt:"Pintado",es:"Pintado",alt:["Roto","Viejo","Sucio"]},{pt:"Galhos",es:"Ramas",alt:["Piedras","Flores","Ríos"]}],
            // Bloco 25: Lazer, Diversão e Rotina
            [{pt:"Filme",es:"Película",alt:["Libro","Juego","Música"]},{pt:"Desenhar",es:"Dibujar",alt:["Cantar","Bailar","Escribir"]},{pt:"Sorveteria",es:"Heladería",alt:["Cafetería","Farmacia","Hotel"]},{pt:"Lanchonete",es:"Cafetería",alt:["Hotel","Cine","Tienda"]},{pt:"Pipas",es:"Cometas",alt:["Globos","Aviones","Pájaros"]},{pt:"Brinquedo",es:"Juguete",alt:["Libro","Ropa","Zapato"]},{pt:"Treme",es:"Tiembla",alt:["Corre","Salta","Camina"]},{pt:"Moro",es:"Vivo",alt:["Viajo","Salgo","Trabajo"]},{pt:"Saída",es:"Salida",alt:["Entrada","Pasillo","Ascensor"]},{pt:"Sairemos",es:"Iremos",alt:["Nos quedamos","Volvemos","Salimos"]}],
            // Bloco 26: Palavras Finais e Expressões Diversas
            [{pt:"Saio",es:"Salgo",alt:["Entro","Vuelvo","Me quedo"]},{pt:"Cachecol",es:"Bufanda",alt:["Abrigo","Gorro","Guantes"]},{pt:"Atraso",es:"Retraso",alt:["Adelante","Pronto","Hora"]},{pt:"Volta",es:"Vuelve",alt:["Sale","Va","Corre"]},{pt:"Pássaro",es:"Pájaro",alt:["Gato","Perro","Caballo"]},{pt:"Zombando",es:"Burlaba",alt:["Cantando","Bailando","Jugando"]},{pt:"Chefe",es:"Jefe",alt:["Empleado","Amigo","Conductor"]},{pt:"Vergonha",es:"Vergüenza",alt:["Alegría","Orgullo","Miedo"]},{pt:"De carro",es:"En coche",alt:["En avión","En tren","A pie"]},{pt:"Eu sei",es:"Yo sé",alt:["No sé","Quiero","Puedo"]}]
        ];

        let moduloAtual = 0, bancoPalavras = [], indiceExercicio = 0, errosCometidos = 0;
        let itemSelecionadoEs = null, itemSelecionadoPt = null, acertosCombinar = 0, moduloConcluidoComSucesso = false;

        function emitirSom(termo) {
            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString("falar:" + termo);
                setTimeout(function() { window.AppInventor.setWebViewString(""); }, 150);
            } else {
                const fala = new SpeechSynthesisUtterance(termo);
                fala.lang = 'es-ES'; window.speechSynthesis.speak(fala);
            }
        }

        function mudarTela(idTelaAlvo) {
            const telas = ['tela-menu', 'tela-reconhecimento', 'tela-exercicio', 'tela-combinar', 'tela-parabens'];
            telas.forEach(t => document.getElementById(t).classList.add('oculto'));
            document.getElementById("global-progress").style.display = (idTelaAlvo === 'tela-menu' || idTelaAlvo === 'tela-parabens') ? 'none' : 'block';
            document.getElementById(idTelaAlvo).classList.remove('oculto');
            window.scrollTo(0,0);
        }

        function atualizarBarraProgresso(porcentagem) {
            document.getElementById("progress-indicator").style.width = porcentagem + "%";
        }

        function carregarModulo(index) {
            moduloAtual = index; bancoPalavras = macroBlocos[moduloAtual];
            const container = document.getElementById("container-reconhecer"); container.innerHTML = "";
            atualizarBarraProgresso(10);
            bancoPalavras.forEach(item => {
                const div = document.createElement("div"); div.className = "item-reconhecer";
                div.onclick = () => emitirSom(item.es);
                div.innerHTML = `<span><strong>${item.pt}</strong>: ${item.es}</span> <span class="speaker-icon">🔊</span>`;
                container.appendChild(div);
            });
            mudarTela("tela-reconhecimento");
        }

        function iniciarMultiplaEscolha() {
            indiceExercicio = 0; errosCometidos = 0; renderizarPergunta(); mudarTela("tela-exercicio");
        }

        function renderizarPergunta() {
            if (indiceExercicio >= bancoPalavras.length) { iniciarCombinarColunas(); return; }
            let progressoCalculado = 10 + Math.floor((indiceExercicio / bancoPalavras.length) * 40);
            atualizarBarraProgresso(progressoCalculado);
            const itemAtual = bancoPalavras[indiceExercicio];
            document.getElementById("texto-pergunta").innerText = `Como se diz "${itemAtual.pt}"?`;
            const opcoes = [itemAtual.es, ...itemAtual.alt].sort(() => Math.random() - 0.5);
            const containerOpcoes = document.getElementById("container-opcoes"); containerOpcoes.innerHTML = "";
            opcoes.forEach(opcao => {
                const btn = document.createElement("button"); btn.className = "btn-opcao"; btn.innerText = opcao;
                btn.onclick = () => checarResposta(opcao, itemAtual.es, btn); containerOpcoes.appendChild(btn);
            });
        }

        function checarResposta(selecionada, correta, elementoBtn) {
            document.querySelectorAll(".btn-opcao").forEach(b => b.removeAttribute("onclick"));
            if (selecionada === correta) {
                elementoBtn.style.borderColor = "#2cd46b"; elementoBtn.style.backgroundColor = "#f0fdf4"; elementoBtn.style.color = "#166534"; emitirSom(correta);
            } else {
                elementoBtn.style.borderColor = "#ef4444"; elementoBtn.style.backgroundColor = "#fef2f2"; elementoBtn.style.color = "#991b1b"; errosCometidos++;
            }
            setTimeout(() => { indiceExercicio++; renderizarPergunta(); }, 800);
        }

        function iniciarCombinarColunas() {
            acertosCombinar = 0; itemSelecionadoEs = null; itemSelecionadoPt = null; atualizarBarraProgresso(55);
            const listaEs = [...bancoPalavras].sort(() => Math.random() - 0.5);
            const listaPt = [...bancoPalavras].sort(() => Math.random() - 0.5);
            const colEs = document.getElementById("coluna-espanhol"); const colPt = document.getElementById("coluna-portugues");
            colEs.innerHTML = ""; colPt.innerHTML = "";
            listaEs.forEach(item => {
                const btn = document.createElement("button"); btn.className = "btn-combinar"; btn.innerText = item.es;
                btn.setAttribute("data-es", item.es); btn.onclick = () => selecionarElemento(btn, 'es'); colEs.appendChild(btn);
            });
            listaPt.forEach(item => {
                const btn = document.createElement("button"); btn.className = "btn-combinar"; btn.innerText = item.pt;
                btn.setAttribute("data-es", item.es); btn.onclick = () => selecionarElemento(btn, 'pt'); colPt.appendChild(btn);
            });
            mudarTela("tela-combinar");
        }

        function selecionarElemento(elemento, tipo) {
            if (tipo === 'es') {
                document.querySelectorAll("#coluna-espanhol .btn-combinar").forEach(b => b.classList.remove("selecionado")); itemSelecionadoEs = elemento;
            } else {
                document.querySelectorAll("#coluna-portugues .btn-combinar").forEach(b => b.classList.remove("selecionado")); itemSelecionadoPt = elemento;
            }
            elemento.classList.add("selecionado");
            if (itemSelecionadoEs && itemSelecionadoPt) {
                const chaveEs = itemSelecionadoEs.getAttribute("data-es"), chavePt = itemSelecionadoPt.getAttribute("data-es");
                if (chaveEs === chavePt) {
                    itemSelecionadoEs.className = "btn-combinar correto"; itemSelecionadoPt.className = "btn-combinar correto";
                    emitirSom(chaveEs); acertosCombinar++; itemSelecionadoEs = null; itemSelecionadoPt = null;
                    let progressoCombinar = 55 + Math.floor((acertosCombinar / bancoPalavras.length) * 45); atualizarBarraProgresso(progressoCombinar);
                    if (acertosCombinar === bancoPalavras.length) setTimeout(finalizarModulo, 600);
                } else {
                    const elEs = itemSelecionadoEs, elPt = itemSelecionadoPt;
                    elEs.style.borderColor = "#ef4444"; elPt.style.borderColor = "#ef4444"; errosCometidos++;
                    setTimeout(() => { elEs.classList.remove("selecionado"); elPt.classList.remove("selecionado"); elEs.style.borderColor = "#e2e8f0"; elPt.style.borderColor = "#e2e8f0"; }, 400);
                    itemSelecionadoEs = null; itemSelecionadoPt = null;
                }
            }
        }

        function finalizarModulo() {
            const titulo = document.getElementById("titulo-resultado"), msg = document.getElementById("mensagem-resultado");
            if (errosCometidos === 0) {
                moduloConcluidoComSucesso = true; titulo.innerText = "¡Perfecto! 🏆"; titulo.style.color = "#166534";
                msg.innerHTML = "Excelente! Você concluiu todas as etapas deste bloco com <strong>100% de precisão</strong> e sem nenhum erro!";
            } else {
                moduloConcluidoComSucesso = false; titulo.innerText = "¡Buen intento! 👍"; titulo.style.color = "#1e3a8a";
                msg.innerHTML = `Você chegou ao fim! Porém, cometeu <strong>${errosCometidos} deslizes</strong> técnico(s) durante os testes.<br><br>Gabarite o bloco sem erros para receber a insígnia verde.`;
            }
            mudarTela("tela-parabens");
        }

        function voltarAoMenu() {
            if (moduloConcluidoComSucesso) {
                const b = document.getElementById("bloco-" + moduloAtual);
                if (b) {
                    b.className = "btn-bloco concluido";
                    const badge = document.getElementById("badge-bloco-" + moduloAtual);
                    if (badge) badge.innerText = "Gabaritado";
                }
            }
            mudarTela("tela-menu");
        }
    </script>
